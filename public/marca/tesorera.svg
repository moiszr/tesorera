<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tesorera</title>
  <!--
    La marca es el mismo objeto que la app: el libro de caja encuadernado.
    Tela oxblood, lomo cosido a la izquierda, hoja de papel con su raya de
    margen roja y tres renglones escritos.
    Formas gruesas a propósito: tiene que leerse a 16px en la barra de tareas.
  -->
  <defs>
    <clipPath id="cubierta">
      <rect x="0" y="0" width="512" height="512" rx="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#cubierta)">
    <!-- Cubierta de tela -->
    <rect width="512" height="512" fill="#2563eb" />

    <!-- El lomo: banda más oscura con los dos nervios de la encuadernación -->
    <rect x="0" y="0" width="104" height="512" fill="#1d4ed8" />
    <rect x="96" y="0" width="8" height="512" fill="#1e40af" />
    <rect x="30" y="150" width="44" height="14" rx="7" fill="#60a5fa" />
    <rect x="30" y="348" width="44" height="14" rx="7" fill="#60a5fa" />

    <!-- La hoja -->
    <rect x="152" y="96" width="296" height="320" rx="16" fill="#fffdf8" />

    <!-- La raya roja de margen del libro mayor.
         Gruesa a propósito: a 32px una raya de 1px desaparece. -->
    <rect x="194" y="96" width="12" height="320" fill="#f59e0b" />

    <!-- Los renglones escritos, y el último más corto: una cuenta a medias -->
    <rect x="236" y="164" width="176" height="22" rx="11" fill="#2563eb" />
    <rect x="236" y="234" width="176" height="22" rx="11" fill="#c9c0b2" />
    <rect x="236" y="304" width="104" height="22" rx="11" fill="#c9c0b2" />
  </g>
</svg>
