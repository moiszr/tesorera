<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tesorera — opción 3: la suma</title>
  <!--
    Dirección: símbolo abstracto, sin letra, sin papel y sin dinero.

    Abonar es sumar. El gesto que ella repite veinte veces un domingo después
    del culto —buscar, escribir el monto, confirmar— es una suma, y el símbolo
    de la suma es lo único que hace falta dibujar. Es además el único de los
    tres que no trata a nadie de deudor: no dice "falta", dice "entró".

    Dos cápsulas cruzadas, y el brazo horizontal es DELIBERADAMENTE más largo
    (360px) que el vertical (280px). Eso es lo que lo mantiene en "más" y lo
    aleja de una cruz, que siempre es más alta que ancha. El brazo blanco pasa
    por delante para que el centro quede al máximo contraste a tamaño chico.

    El campo es pizarra profunda, de la familia de {iglesia-pizarra}: un neutro
    oscuro, no un color de acción, así que no le compite al morado de la
    interfaz. El morado vuelve en el brazo vertical, que es lo único que pide
    chispa. Si el campo pizarra se ve apagado, este mismo dibujo funciona en
    violeta #6D28D9 sin tocar la geometría.

    A 16px: brazo horizontal 11,3 × 2,6px; vertical 2,6 × 8,8px.
  -->
  <rect width="512" height="512" rx="112" fill="#334155" />

  <!-- Brazo vertical -->
  <rect x="214" y="116" width="84" height="280" rx="42" fill="#8A7CFF" />
  <!-- Brazo horizontal, por delante -->
  <rect x="76" y="214" width="360" height="84" rx="42" fill="#FFFFFF" />
</svg>
