    <!--
      EL LIBRO DE CAJA — contrato de dirección

      THESIS: La libreta de tesorería que ella ya sabe leer, hecha herramienta
      moderna. Rechaza el panel de control de tarjetas: manda el renglón
      reglado y la columna de cifras alineadas. Y rechaza también el disfraz de
      cuaderno viejo: la identidad vive en el papel, la tinta y las cifras, no
      en ornamento de época.

      OWN-WORLD: Lomo de tela oxblood (#47222a) con las cuatro pestañas; hoja
      de papel cálido (#fffdf8) definida por hairline, no por sombra, sobre
      mesa oat (#f3efe6); renglones separados por una sola raya fina, sin trama
      alterna; Fira Sans en una familia con cifras tabulares; verde/ámbar/gris
      solo para estado de pago y siempre con texto; ningún color de identidad
      toma prestado un tono de estado.

      STORY: Ve de un golpe cuánto se lleva y cuánto falta, encuentra a
      cualquiera escribiendo tres letras sin tildes, y registra un abono en
      tres acciones sin soltar el teclado.

      FIRST VIEWPORT: Lomo a la izquierda con el evento y la cuenta regresiva.
      A la derecha, una hoja que contiene lo recaudado en cifra grande, la
      barra a todo el ancho, el renglón de resumen y el doblez con las dos
      listas. "Registrar pago" es el único botón sólido de la pantalla.

      FORM: Dirección fijada por el brief (CLAUDE.md §Diseño: "libreta de
      tesorería moderna"). Seed 1b3f00e6; el brief le gana al dado por contrato.
      Corregido en revisión con el usuario: lo literal del cuaderno (columna de
      folio, trama alterna, raya de margen roja) se quitó por leerse a viejo;
      quitar además la superficie de la hoja fue un paso de más y se revirtió.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
