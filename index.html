    <!--
      TESORERA — contrato de dirección

      THESIS: Una herramienta de datos moderna para cobrar, no un facsímil de
      cuaderno. Rechaza por igual el panel de tarjetas sin jerarquía y el
      disfraz de época: la claridad de la cifra y del estado manda sobre
      cualquier evocación.

      OWN-WORLD: Neutros fríos —lienzo #f7f7f8, superficies blancas, rayas
      #e8e8ea— con UN acento azul vivo (#2563eb) reservado a las acciones, a la
      entrada activa y al progreso agregado. Barra lateral clara, del tono del lienzo, separada por
      una raya: el bloque de color saturado a la izquierda era lo que más
      envejecía la pantalla. Fira Sans en una sola familia con cifras
      tabulares. Verde/ámbar/gris solo para estado de pago y siempre con texto;
      ningún color de identidad toma prestado un tono de estado.

      STORY: Ve de un golpe cuánto se lleva y cuánto falta, encuentra a
      cualquiera escribiendo tres letras sin tildes, y registra un abono en
      tres acciones sin soltar el teclado.

      FIRST VIEWPORT: Lateral clara con las cuatro entradas. A la derecha, el
      nombre del evento y una fila de cuatro métricas —lo recaudado destacado
      en el acento—, la barra de progreso con las dos acciones, y debajo las
      dos listas. "Registrar pago" es el único botón sólido.

      FORM: El brief pedía "libreta de tesorería moderna" (CLAUDE.md §Diseño) y
      la primera lectura fue literal: papel crema, lomo de tela, trama alterna,
      raya de margen roja, cifras de 56px. El usuario lo rechazó por leerse
      viejo, y después pidió color vivo tirando a azul, tipo Notion. La
      identidad quedó en el acento azul, las cifras tabulares y la disciplina de
      las rayas. Seed 1b3f00e6.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
