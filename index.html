      EL LIBRO DE CAJA — contrato de dirección

      THESIS: La app es el libro de contabilidad encuadernado que ella ya sabe
      leer, no un panel de control. Rechaza la retícula de tarjetas del dashboard
      genérico: aquí manda el renglón reglado y la columna de cifras.

      OWN-WORLD: Lomo de tela oxblood (#47222a) a la izquierda con las cuatro
      pestañas del libro; hoja de papel cálido (#fffdf8) sobre mesa oat (#f3efe6);
      renglones separados por hairlines con alternancia tenue, nunca tarjetas
      anidadas; raya de margen roja (#a8443c) al 28%; Fira Sans en una sola
      familia con cifras tabulares; verde/ámbar/gris solo para estado de pago y
      siempre acompañados de texto.

      STORY: Ella entiende en un vistazo cuánto se lleva recaudado y cuánto falta,
      encuentra a cualquier hermano escribiendo tres letras sin tildes, y registra
      un abono en tres acciones sin soltar el teclado.

      FIRST VIEWPORT: Lomo de 224px a la izquierda con el nombre del evento y la
      cuenta regresiva. A la derecha, lo recaudado en cifra de 3.5rem sobre la
      hoja, la barra de progreso a todo el ancho, y "Registrar pago" como el único
      botón sólido de la pantalla.

      FORM: Dirección fijada por el brief (CLAUDE.md §Diseño: "libreta de
      tesorería moderna"). Seed 1b3f00e6; el brief le gana al dado por contrato.
    -->
